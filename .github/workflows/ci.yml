name: FloraByte CI

on:
  push:
    branches: [main, integration, fix/florabyte-integration]
  pull_request:

jobs:
  backend-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run pytest suite
        run: pytest -q

      - name: Install frontend dependencies, lint, and build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Run self-check Secrets/SAST repository security scan
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "backend")
          from security_scanners.core.models import ScanInput, SourceFile
          from security_scanners.secrets.scanner import SecretsScanner

          skip = {".git", "node_modules", "dist", "tests", ".venv", "__pycache__"}
          files = []
          for p in Path(".").rglob("*"):
              if not p.is_file() or any(part in skip for part in p.parts):
                  continue
              if p.suffix in {".py", ".ts", ".tsx", ".yml", ".yaml", ".json"}:
                  try:
                      files.append(SourceFile(path=p.as_posix(), content=p.read_text(encoding="utf-8")))
                  except Exception:
                      pass
          res = SecretsScanner().scan(ScanInput(repo_path=".", files=files))
          real = [f for f in res.findings if "example" not in f.file.lower() and "test" not in f.file.lower()]
          print(f"Scanned {res.stats.files_scanned} files, suspicious findings={len(real)}")
          assert len(real) == 0, f"Unexpected secret findings: {[(f.file, f.line, f.type) for f in real]}"
          PY
