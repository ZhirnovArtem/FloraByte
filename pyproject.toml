[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cybergarden-sast"
version = "0.1.0"
description = "Team-authored regex-first SAST for Kotlin/Spring Boot training projects"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cybergarden-sast = "scanners.sast.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
