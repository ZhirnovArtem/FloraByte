[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "florabyte"
version = "0.2.0"
description = "FloraByte AI Security Workflow platform with Secrets, SCA, SAST scanners and AI explanation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0,<3",
    "pydantic-settings>=2.6.0",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0.36",
    "apscheduler>=3.10.4",
    "httpx>=0.27.2",
    "cryptography>=43.0.0",
    "python-multipart>=0.0.12",
    "websockets>=13.1",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "anyio>=4.6.0",
]

[project.scripts]
cybergarden-sast = "scanners.sast.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scanners*", "security_scanners*"]

[tool.setuptools.package-data]
"security_scanners.sca" = ["vulnerabilities.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
pythonpath = [".", "backend"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
